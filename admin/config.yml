backend:
  name: git-gateway
  branch: main

# Каде се чуваат прикачените слики
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Јазик на интерфејсот
locale: "mk"

collections:
  # Колекциите „Блог" и „Производи" се отстранети — тие страници се
  # уредуваат директно во HTML. content/products.json останува во репото:
  # од него кошничката ги чита цените и функцијата create-payment ја
  # пресметува сумата што се наплаќа. Мора да се одржува рачно, заедно
  # со цените напишани во proizvod-*.html, products.html и index.html.

  # ---------- ПОСТАВКИ ----------
  - name: "settings"
    label: "Поставки"
    files:
      - name: "general"
        label: "Почетна и контакт"
        file: "content/settings.json"
        format: "json"
        description: "Уреди го текстот на почетната страница и контакт податоците."
        fields:
          - name: "hero"
            label: "Почетна (hero)"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Мала ознака", widget: "string", required: false }
              - { name: "title", label: "Главен наслов", widget: "string" }
              - { name: "subtitle", label: "Поднаслов", widget: "text" }
          - name: "contact"
            label: "Контакт"
            widget: "object"
            fields:
              - { name: "address", label: "Адреса", widget: "string" }
              - { name: "email", label: "Е-пошта", widget: "string" }
              - { name: "phone", label: "Телефон", widget: "string" }
          - name: "payment"
            label: "Плаќање и достава (страница Нарачка)"
            widget: "object"
            fields:
              - { name: "accountName", label: "Примач (име на сметка)", widget: "string" }
              - { name: "bankName", label: "Банка", widget: "string" }
              - { name: "iban", label: "Сметка / IBAN", widget: "string" }
              - { name: "codNote", label: "Текст за плаќање при достава", widget: "text" }
              - { name: "deliveryNote", label: "Текст за достава", widget: "text" }
              - { name: "deliveryFee", label: "Цена за достава (ден.)", widget: "number", value_type: "int", min: 0, default: 130, hint: "Се додава на сумата што се наплаќа со картичка." }
              - { name: "freeDeliveryOver", label: "Бесплатна достава над (ден.)", widget: "number", value_type: "int", min: 0, default: 1200, hint: "Ако меѓузбирот е еднаков или поголем од овој износ, доставата е бесплатна." }
